<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Cute Graduation Cap Icon -->
  <g transform="translate(18, 16) scale(0.65)">
    <!-- Book Pages -->
    <path d="M10 70 Q 50 85 90 70 L 90 40 Q 50 55 10 40 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M10 75 Q 50 90 90 75 L 90 70 Q 50 85 10 70 Z" fill="#f1f5f9"/>
    
    <!-- Cap Top -->
    <polygon points="50,15 95,35 50,55 5,35" fill="#facc15" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Cap Skull -->
    <path d="M25 44 L25 65 Q50 80 75 65 L75 44" fill="#ca8a04" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Tassel -->
    <path d="M50 35 L82 48 L84 68" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="84" cy="70" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Cute Star Sparkle -->
  <path d="M78 20 Q78 30 88 30 Q78 30 78 40 Q78 30 68 30 Q78 30 78 20 Z" fill="#ffffff"/>
  <path d="M22 75 Q22 80 27 80 Q22 80 22 85 Q22 80 17 80 Q22 80 22 75 Z" fill="#ffffff" opacity="0.8"/>
</svg>