    <text x="28" y="278" font-size="11" fill="#94a3b8">檢查單位一致性，代回原題逆向驗算</text>
  </g>

  <!-- Bottom Cross-Grade Bridge Bar -->
  <rect x="20" y="404" width="760" height="48" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="36" y="425" font-size="12.5" font-weight="800" fill="#fbbf24">🚀 跨學段銜接與生活應用：國中會考國文科【長文閱讀與雙文本對讀】：跨領域圖表素養題、非連續性文本資訊轉換與推…</text>
  <text x="36" y="443" font-size="11.5" fill="#cbd5e1">🌍 生活實踐：辨別社群媒體新聞真實性、閱讀各類家電說明書與合約條款、摘要會議重點。</text>
</svg>