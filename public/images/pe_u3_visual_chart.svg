  <text x="36" y="425" font-size="12.5" font-weight="800" fill="#fb923c">🚀 跨學段銜接與生活應用：國二健康教育【急救與安全教育】：包紮止血法、骨折固定法、溺水與燒燙傷五步驟（沖脫泡…</text>
  <text x="36" y="443" font-size="11.5" fill="#cbd5e1">🌍 生活實踐：在校園運動場遇同學昏倒呼吸停止能臨危不亂啟動急救、居家生活中防範長輩幼童噎食意外。</text>
</svg>