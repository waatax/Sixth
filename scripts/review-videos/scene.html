<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>review video scene</title>
<link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css">
<script src="../../node_modules/katex/dist/katex.min.js"></script>
<style>
  :root { --c: #2563EB; --soft: #E8F0FF; --ink: #1F2A44; --muted: #5B6680; --paper: #FFFDF8; --ok: #15803D; --okbg: #E7F7EC; --bad: #B91C1C; --badbg: #FDECEC; --warn: #A16207; --warnbg: #FEF6DC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: "Microsoft JhengHei", "微軟正黑體", "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; background:
      radial-gradient(1200px 600px at 100% 0%, var(--soft), transparent 70%),
      radial-gradient(900px 500px at 0% 100%, var(--soft), transparent 70%), var(--paper); }
  header { position: absolute; left: 0; right: 0; top: 0; height: 104px; display: flex; align-items: center; gap: 22px; padding: 0 64px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 28px; color: var(--c); }
  .brand .dot { width: 54px; height: 54px; border-radius: 16px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 30px; }
  .crumb { font-size: 26px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .badge { font-size: 28px; font-weight: 700; padding: 10px 24px; border-radius: 999px; background: var(--c); color: #fff; white-space: nowrap; }
  main { position: absolute; left: 64px; right: 64px; top: 112px; bottom: 76px; overflow: hidden; }
  #fit { transform-origin: top left; }
  footer { position: absolute; left: 64px; right: 64px; bottom: 26px; height: 26px; display: flex; align-items: center; gap: 18px; }
  .bar { flex: 1; height: 10px; border-radius: 6px; background: rgba(0,0,0,.08); position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 6px; }
  .foot { font-size: 20px; color: var(--muted); font-weight: 700; white-space: nowrap; }

  .card { background: #fff; border-radius: 28px; box-shadow: 0 6px 24px rgba(31,42,68,.08); border: 2px solid rgba(31,42,68,.06); }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 700; color: var(--c); background: var(--soft); padding: 8px 22px; border-radius: 999px; }
  .chip { display: inline-block; font-size: 24px; font-weight: 700; padding: 6px 18px; border-radius: 999px; background: #F1F3F8; color: var(--muted); margin-right: 10px; }
  h1 { font-size: 64px; line-height: 1.2; margin: 18px 0 26px; letter-spacing: 1px; }
  h2 { font-size: 46px; line-height: 1.25; margin: 14px 0 22px; }
  .hid { visibility: hidden; }
  .now { outline: 4px solid var(--c); outline-offset: 0; background: var(--soft) !important; }
  .lines { display: flex; flex-direction: column; gap: 16px; }
  .line { display: flex; gap: 20px; align-items: flex-start; padding: 20px 28px; font-size: 38px; line-height: 1.55; background: #fff; border-radius: 22px; border: 2px solid rgba(31,42,68,.06); }
  .num { flex: 0 0 auto; min-width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 700; font-size: 28px; display: grid; place-items: center; margin-top: 4px; }
  .line .t { flex: 1; min-width: 0; }
  b, strong { color: var(--c); }
  code { font-family: Consolas, monospace; background: #F1F3F8; padding: 2px 8px; border-radius: 8px; font-size: .9em; }
  table.md { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 34px; line-height: 1.45; background: #fff; border-radius: 22px; overflow: hidden; border: 2px solid rgba(31,42,68,.08); }
  table.md th { background: var(--c); color: #fff; text-align: left; padding: 14px 22px; }
  table.md td { padding: 14px 22px; border-top: 2px solid rgba(31,42,68,.06); }
  .katex { font-size: 1.05em; }
  .katex-display { margin: .2em 0; }

  /* cover */
  .cover { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 34px; }
  .cover .big { display: flex; align-items: center; gap: 40px; }
  .cover .emo { width: 200px; height: 200px; border-radius: 56px; background: var(--c); display: grid; place-items: center; font-size: 120px; box-shadow: 0 20px 50px rgba(0,0,0,.15); }
  .cover h1 { font-size: 96px; margin: 0; }
  .cover .sub { font-size: 42px; color: var(--muted); font-weight: 700; margin-top: 12px; }
  .units { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 22px; }
  .unitcard { padding: 26px 32px; font-size: 34px; line-height: 1.4; font-weight: 700; }
  .unitcard small { display: block; color: var(--c); font-size: 26px; margin-bottom: 6px; }

  /* unit intro */
  .unit { display: grid; grid-template-columns: 300px 1fr; gap: 48px; height: 100%; align-items: center; }
  .ring { width: 300px; height: 300px; border-radius: 50%; background: var(--c); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,.15); }
  .ring span { font-size: 40px; font-weight: 700; opacity: .9; }
  .ring span:last-child { font-size: 28px; }
  .opt .katex, .ans .katex { font-size: 1.3em; }
  .trap.now { background: var(--warnbg) !important; outline-color: #D99A00; }
  .ring strong { font-size: 150px; line-height: 1; color: #fff; }
  .meta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .box { padding: 22px 28px; font-size: 32px; line-height: 1.5; }
  .box h3 { margin: 0 0 8px; font-size: 28px; color: var(--c); }
  .hl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .hl .box h3 { font-size: 32px; color: var(--ink); }
  .stars { color: #E0A000; font-size: 24px; font-weight: 700; }

  /* formulas */
  .formula { padding: 26px 34px; margin-bottom: 20px; }
  .formula .name { font-size: 34px; font-weight: 700; color: var(--c); }
  .formula .tex { font-size: 46px; margin: 12px 0; overflow: hidden; }
  .formula .detail { font-size: 30px; line-height: 1.5; color: var(--muted); }

  /* question */
  .qhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .qstem { font-size: 52px; line-height: 1.6; margin: 26px 0 30px; font-weight: 700; }
  .qstem p { margin: 0 0 12px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .opts.one { grid-template-columns: 1fr; }
  .opt { display: flex; gap: 22px; align-items: center; padding: 24px 32px; font-size: 46px; line-height: 1.45; }
  .opt .k { flex: 0 0 64px; height: 64px; border-radius: 18px; background: var(--soft); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 36px; }
  .opt.right { background: var(--okbg); border-color: var(--ok); }
  .opt.right .k { background: var(--ok); color: #fff; }
  .think { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; color: var(--warn); background: var(--warnbg); padding: 12px 26px; border-radius: 999px; }
  .count { position: absolute; right: 0; top: -6px; display: flex; align-items: center; gap: 16px; padding: 4px 34px 4px 26px; border-radius: 999px; background: var(--c); color: #fff; font-size: 34px; font-weight: 700; box-shadow: 0 10px 26px rgba(0,0,0,.18); }
  .count strong { font-size: 64px; line-height: 1.1; color: #fff; }
  .src { font-size: 24px; color: var(--muted); font-weight: 700; }

  /* answer */
  .ansrow { display: flex; gap: 22px; align-items: stretch; margin: 20px 0; }
  .ans { flex: 1; background: var(--okbg); border: 3px solid var(--ok); border-radius: 26px; padding: 18px 30px; font-size: 42px; font-weight: 700; color: var(--ok); line-height: 1.45; }
  .ans small { display: block; font-size: 26px; color: var(--ok); opacity: .85; }
  .mini { font-size: 30px; color: var(--muted); line-height: 1.5; font-weight: 700; }
  .agrid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 24px; }
  .agrid .line { font-size: 34px; padding: 16px 24px; }
  .side { display: flex; flex-direction: column; gap: 20px; }
  .key { background: #EEF4FF; border-radius: 22px; padding: 20px 26px; font-size: 32px; line-height: 1.5; }
  .key h3, .trap h3 { margin: 0 0 6px; font-size: 28px; }
  .trap { background: var(--warnbg); border-radius: 22px; padding: 20px 26px; font-size: 32px; line-height: 1.5; color: #6B4A00; }

  /* pitfalls */
  .pit { background: var(--badbg) !important; border-color: rgba(185,28,28,.18) !important; }
  .pit .num { background: var(--bad); }
  .pit.now { outline-color: var(--bad); }

  /* summary */
  .check .num { background: #fff; border: 4px solid var(--c); color: var(--c); }
  .check.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rescue { margin-top: 22px; padding: 24px 32px; border-radius: 26px; background: var(--c); color: #fff; font-size: 38px; line-height: 1.5; font-weight: 700; }
  .rescue small { display: block; font-size: 26px; opacity: .85; }

  /* guide */
  .ggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .gcard { padding: 24px 30px; font-size: 30px; line-height: 1.5; }
  .gcard h3 { margin: 0 0 10px; font-size: 38px; color: var(--c); }
  .gcard ol { margin: 0 0 10px; padding-left: 1.3em; }
  .gcard .tr { color: var(--bad); font-weight: 700; }

  .typemap .line .t b { font-size: 40px; }
  #fit > .cover, #fit > .outro, #fit > .unit { min-height: inherit; }
  .outro { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 28px; }
  .outro h1 { font-size: 88px; margin: 0; }
  .steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .steps4 .box { font-size: 32px; }
  .note { font-size: 28px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><div class="dot">🏝️</div>小小學習島・段考重點複習</div>
    <div class="crumb" id="crumb"></div>
    <div class="badge" id="badge"></div>
  </header>
  <main><div id="fit"></div></main>
  <footer><div class="bar"><i id="prog"></i></div><div class="foot" id="foot"></div></footer>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function tex(t, display) {
  try { return katex.renderToString(t, { throwOnError: false, displayMode: !!display, strict: 'ignore', trust: false }); }
  catch (e) { return esc(t); }
}
function inline(text) {
  const s = String(text ?? '').replace(/\\n(?![a-z])/g, '\n').replace(/<br\s*\/?>/gi, '\n');
  const parts = s.split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/);
  return parts.map((p) => {
    if (/^\$\$[\s\S]+\$\$$/.test(p)) return tex(p.slice(2, -2), true);
    if (/^\$[^$]+\$$/.test(p)) return tex(p.slice(1, -1), false);
    return esc(p).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/【([^】]+)】/g, '<b>【$1】</b>').replace(/\n/g, '<br>');
  }).join('');
}
function block(b) {
  if (b.type === 'table') {
    const [h, ...rows] = b.rows;
    return `<table class="md"><thead><tr>${h.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return inline(b.text);
}
const vis = (i, show) => (i <= show ? (i === show ? ' now' : '') : ' hid');

const R = {
  cover(d) {
    return `<div class="cover"><div class="big"><div class="emo">${V.emoji}</div><div><h1>${esc(d.title)}</h1><div class="sub">${esc(d.termName)}・${esc(d.examFull)}・涵蓋 ${d.units.length} 個單元</div></div></div>
    <div class="units">${d.units.map((u) => `<div class="card unitcard"><small>${esc(u.label)}</small>${inline(u.title)}</div>`).join('')}</div>
    <div class="note">📌 核心觀念 → 必背公式 → 段考補強 → 考古題型實戰 → 易錯陷阱 → 小結</div></div>`;
  },
  unit(d, st, si) {
    const show = si;
    return `<div class="unit"><div class="ring"><span>${esc(d.labelWord)}</span><strong>${esc(d.labelNum)}</strong><span>第 ${d.index} / ${d.total} 個</span></div><div>
      <h1 style="margin-top:0">${inline(d.title)}</h1>
      <div class="meta">${d.coverage ? `<span class="chip">📚 ${esc(d.coverage)}</span>` : ''}${d.weight ? `<span class="chip">⚖️ ${esc(d.weight)}</span>` : ''}${d.hot ? `<span class="chip">🔥 ${esc(d.hot)}</span>` : ''}</div>
      <div class="pair${show < 1 ? ' hid' : ''}"><div class="card box"><h3>🧱 先備觀念</h3>${inline(d.prior)}</div><div class="card box"><h3>🎯 要練成的能力</h3>${inline(d.mastery)}</div></div>
      <div class="hl">${d.highlights.slice(0, 3).map((h, i) => `<div class="card box${vis(i + 2, show)}"><div class="stars">${esc(h.star || '')}</div><h3>${inline(h.point)}</h3>${inline(h.detail)}</div>`).join('')}</div>
    </div></div>`;
  },
  concept(d, st) {
    return `<span class="tag">💡 核心觀念 ${d.n} / ${d.total}</span><h1>${inline(d.title)}</h1>
      <div class="lines">${d.lines.map((l, i) => `<div class="line${vis(i + 1, st.show)}"><div class="num">${i + 1}</div><div class="t">${inline(l)}</div></div>`).join('')}</div>`;
  },
  formulas(d, st) {
    return `<span class="tag">📐 必背公式・口訣</span><h1>這些一定要會背</h1>
      ${d.items.map((f, i) => `<div class="card formula${vis(i + 1, st.show)}"><div class="name">${i + 1}. ${inline(f.name)}</div><div class="tex">${tex(f.formula, true)}</div><div class="detail">${inline(f.detail)}</div></div>`).join('')}`;
  },
  boost(d, st) {
    return `<span class="tag">🧩 考卷常考・段考補強 ${d.n} / ${d.total}</span><h1>${inline(d.heading)}</h1>
      <div class="lines">${d.blocks.map((b, i) => b.type === 'table'
        ? `<div class="${vis(i + 1, st.show).trim()}" style="border-radius:22px">${block(b)}</div>`
        : `<div class="line${vis(i + 1, st.show)}">${b.type === 'li' ? `<div class="num">${b.ordered ? b.num : '•'}</div>` : ''}<div class="t">${block(b)}</div></div>`).join('')}</div>`;
  },
  extra(d, st) {
    return `<span class="tag">📚 必備知識補充${d.total > 1 ? ` ${d.n} / ${d.total}` : ''}</span><h1>題庫、講義都會考</h1>
      <div class="lines">${d.items.map((t, i) => `<div class="line${vis(i + 1, st.show)}"><div class="num">${i + 1}</div><div class="t">${inline(t)}</div></div>`).join('')}</div>`;
  },
  typemap(d, st) {
    return `<span class="tag">🗺️ 考古題型地圖</span><h1>考卷會怎麼考？</h1>
      <div class="lines typemap">${d.rows.map((r, i) => `<div class="line${vis(i + 1, st.show)}"><div class="num">${i + 1}</div><div class="t"><b>${inline(r.type)}</b>　${inline(r.what)}</div></div>`).join('')}</div>`;
  },
  qheader(d) {
    const q = d.q;
    const src = /^參考/.test(q.source) ? `題型參考：${q.source.replace(/^參考/, '')}・本站重新命題` : q.source === '課綱' ? '依 108 課綱重點命題' : q.source;
    return `<div class="qhead"><span class="tag">✏️ 考古題型實戰 ${d.n} / ${d.total}</span><span class="chip">${esc(q.typeLabel)}</span>${q.kind && q.kind !== q.typeLabel ? `<span class="chip">${esc(q.kind)}題</span>` : ''}<span class="src">${esc(src)}</span></div>`;
  },
  question(d, st) {
    const q = d.q;
    const long = q.options.some((o) => o.text.replace(/\$[^$]*\$/g, 'xx').length > 22);
    return `<div style="position:relative">${R.qheader(d)}
      <div class="qstem">${q.stem.map((b) => `<p>${block(b)}</p>`).join('')}</div>
      ${q.options.length ? `<div class="opts${long ? ' one' : ''}">${q.options.map((o) => `<div class="card opt"><div class="k">${o.key}</div><div>${inline(o.text)}</div></div>`).join('')}</div>` : `<div class="card box" style="font-size:34px;color:var(--muted)">✍️ 請在紙上寫下你的答案${V.subjectName === '數學' || /計算|換算/.test(q.typeLabel + q.kind) ? '和算式' : ''}</div>`}
      </div>
      ${st.countdown ? `<div class="count">⏳ 倒數 <strong>${st.countdown}</strong></div>` : `<div class="think" style="position:absolute;right:0;top:0">⏸️ 先暫停，自己作答</div>`}`;
  },
  answer(d, st) {
    const q = d.q;
    const stemText = q.stem.map((b) => (b.type === 'table' ? '' : b.text)).join(' ');
    const n = q.steps.length;
    return `${R.qheader(d)}
      <div class="mini" style="margin-top:16px">${inline(stemText.length > 120 ? stemText.slice(0, 118) + '…' : stemText)}</div>
      <div class="ansrow"><div class="ans"><small>✅ 正確答案</small>${inline(q.answer)}</div></div>
      <div class="agrid"><div class="lines">${q.steps.map((b, i) => b.type === 'table'
        ? `<div class="${vis(i + 1, st.show).trim()}">${block(b)}</div>`
        : `<div class="line${vis(i + 1, st.show)}"><div class="num">${i + 1}</div><div class="t">${block(b)}</div></div>`).join('')}</div>
      <div class="side">${q.key ? `<div class="key"><h3>🔍 審題關鍵</h3>${inline(q.key)}</div>` : ''}${q.trap ? `<div class="trap${vis(n + 1, st.show)}"><h3>⚠️ 易錯提醒</h3>${inline(q.trap)}</div>` : ''}</div></div>`;
  },
  pitfalls(d, st) {
    return `<span class="tag" style="color:var(--bad);background:var(--badbg)">🚫 易錯陷阱</span><h1>考卷最常見的失分點</h1>
      <div class="lines">${d.items.map((t, i) => `<div class="line pit${vis(i + 1, st.show)}"><div class="num">✕</div><div class="t">${inline(t)}</div></div>`).join('')}</div>`;
  },
  summary(d, st) {
    const n = d.checklist.length;
    return `<span class="tag">✅ 單元小結</span><h1>${inline(d.title)}：考前檢核</h1>
      <div class="lines">${d.checklist.map((t, i) => `<div class="line check${i + 1 <= st.show ? ' done' : ''}${i + 1 === st.show ? ' now' : ''}"><div class="num">${i + 1 <= st.show ? '✓' : i + 1}</div><div class="t">${inline(t)}</div></div>`).join('')}</div>
      ${d.rescue ? `<div class="rescue${n + 1 <= st.show ? '' : ' hid'}"><small>🚑 考前急救口訣</small>${inline(d.rescue)}</div>` : ''}`;
  },
  guide(d, st) {
    return `<span class="tag">🎯 題型破題法${d.total > 1 ? ` ${d.n} / ${d.total}` : ''}</span><h1>每種題型這樣寫</h1>
      <div class="ggrid">${d.items.map((g, i) => `<div class="card gcard${vis(i + 1, st.show)}"><h3>${esc(g.type)}題</h3><ol>${g.steps.map((s) => `<li>${inline(s)}</li>`).join('')}</ol><div class="tr">⚠️ ${inline(g.trap)}</div></div>`).join('')}</div>`;
  },
  outro(d, st) {
    const steps = ['看一次影片抓重點', '題型實戰自己再寫一次', '訂正錯題，寫下錯在哪', '3 天後、7 天後再複習'];
    return `<div class="outro"><div style="font-size:120px">🎉</div><h1>${esc(d.title)}・複習完成！</h1>
      <div class="steps4${st.show >= 1 ? '' : ' hid'}">${steps.map((s, i) => `<div class="card box"><h3>第 ${i + 1} 步</h3>${s}</div>`).join('')}</div>
      <div class="note${st.show >= 2 ? '' : ' hid'}">📌 實際考試範圍以老師公告為準。影片題目依公開考卷題型與 108 課綱重新命題，不是原卷題目。內容由 AI 協助整理，如有疑問請以課本與老師說明為準。</div></div>`;
  }
};

let V = {};
window.renderStep = function (video, scene, stepIndex, progress) {
  V = video;
  const st = scene.steps[stepIndex] || {};
  if (st.show === undefined) st.show = stepIndex;
  document.documentElement.style.setProperty('--c', video.color);
  document.documentElement.style.setProperty('--soft', video.soft);
  document.getElementById('badge').textContent = `${video.emoji} ${video.term}${video.subjectName}・${video.examName}`;
  document.getElementById('crumb').textContent = scene.crumb || '';
  document.getElementById('prog').style.width = `${(progress * 100).toFixed(2)}%`;
  document.getElementById('foot').textContent = scene.foot || '';
  const fit = document.getElementById('fit');
  fit.style.transform = 'none';
  fit.style.width = '100%';
  fit.style.minHeight = '0';
  fit.innerHTML = R[scene.kind](scene.data, st, stepIndex);
  // 自動縮放：內容超出畫面時整體等比縮小
  const main = document.querySelector('main');
  const H = main.clientHeight, W = main.clientWidth;
  let z = 1;
  for (let k = 0; k < 14; k++) {
    fit.style.width = `${W / z}px`;
    fit.style.transform = `scale(${z})`;
    fit.style.minHeight = '0';
    if (fit.scrollHeight * z <= H + 1) { fit.style.minHeight = `${H / z}px`; break; }
    z = Math.max(0.5, z * Math.min(0.97, Math.sqrt(H / (fit.scrollHeight * z))));
  }
  return { zoom: z, overflow: fit.scrollHeight * z > H + 1 };
};
</script>
</body>
</html>
